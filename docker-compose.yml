services:
  postgres:
    image: postgres:16
    container_name: vehiclelisting-postgres
    environment:
      POSTGRES_DB: vehiclelisting
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vehiclelisting_postgres_data:/var/lib/postgresql/data

volumes:
  vehiclelisting_postgres_data:
    driver: local